services:
  postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-substrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-substrate}
      POSTGRES_DB: ${POSTGRES_DB:-substrate}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-substrate}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${FASTAPI_PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-substrate}:${POSTGRES_PASSWORD:-substrate}@postgres:5432/${POSTGRES_DB:-substrate}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./server/substrate:/app/substrate
      - ./migrations:/app/migrations
      - ./docs/sketches/h1-loop:/app/docs/sketches/h1-loop:ro
      - ./docs/sketches/experiments:/app/docs/sketches/experiments:ro
      - ${HOME}/topo-confidence:/root/topo-confidence:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # frontend: run natively in WSL (`cd frontend && npm run dev`) to avoid
  # Docker volume-mount I/O thrashing on WSL2. Re-enable when on a dedicated
  # Linux box or a machine with more headroom.
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "${VITE_PORT:-5173}:5173"
  #   environment:
  #     VITE_WS_URL: ws://localhost:${FASTAPI_PORT:-8080}
  #   depends_on:
  #     server:
  #       condition: service_healthy
  #   volumes:
  #     - ./frontend/src:/app/src
  #     - ./frontend/index.html:/app/index.html

  topoconf_daemon:
    build:
      context: ./daemons/topoconf
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_NAME: "Qwen/Qwen2.5-1.5B-Instruct"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${HOME}/topo-confidence:/topo-confidence:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    profiles: ["topoconf"]
    # GPU (uncomment for 2060 Super):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  pgdata:
