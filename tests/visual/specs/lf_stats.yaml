node_type: lf_stats
display_name: LF Stats
selector: ".react-flow__node-lf_stats"

dimensions:
  min_width: 200
  min_height: 100

capture:
  padding: 20
  interval_seconds: 5
  duration_seconds: 60

elements:
  - selector: "span.text-emerald-400"
    name: success_count
    required: true
  - selector: "span.text-red-400"
    name: fail_count
    required: true
  - selector: ".space-y-1"
    name: stats_container
    required: true

alignment_checks:
  - name: stats_rows_aligned
    description: Stats rows have consistent left edge
    type: element_position
    target: ".space-y-1 > div"
    assert:
      consistent_left_edge: true
      tolerance: 2

detail_panel:
  tabs: [overview, timeseries, config, drift]
  screenshots_per_tab: 1
