node_type: research_bridge
display_name: Research Bridge
selector: ".react-flow__node-research_bridge"

dimensions:
  min_width: 230
  min_height: 120

capture:
  padding: 20
  interval_seconds: 5
  duration_seconds: 60

elements:
  - selector: ".scrollbar-thin"
    name: scroll_container
    required: true
  - selector: ".rounded.border.border-neutral-700"
    name: paper_entries
    required: false
    min_count: 0
  - selector: "span.rounded-full"
    name: relevance_dots
    required: false
    min_count: 0

alignment_checks:
  - name: entries_aligned
    description: Paper entries have consistent left edge
    type: element_position
    target: ".rounded.border.border-neutral-700"
    assert:
      consistent_left_edge: true
      tolerance: 2

detail_panel:
  tabs: [overview, timeseries, config, drift]
  screenshots_per_tab: 1
  optional: true
