node_type: explain_waterfall
display_name: Explain Waterfall
selector: ".react-flow__node-explain_waterfall"

dimensions:
  min_width: 300
  min_height: 200

capture:
  padding: 20
  interval_seconds: 5
  duration_seconds: 60

elements:
  - selector: ".flex.items-center.gap-1"
    name: waterfall_rows
    required: true
    min_count: 5
  - selector: "span.font-mono"
    name: contribution_values
    required: true
    min_count: 5

alignment_checks:
  - name: bars_consistent_width
    description: All contribution bar containers have equal width
    type: element_position
    target: ".relative.h-3.flex-1"
    assert:
      consistent_width: true
      tolerance: 2

  - name: values_right_aligned
    description: Contribution values right-aligned in column
    type: element_position
    target: "span.font-mono"
    assert:
      consistent_right_edge: true
      tolerance: 2
